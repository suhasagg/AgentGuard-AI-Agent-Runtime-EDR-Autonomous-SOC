services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: agentguard, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U postgres -d agentguard"], interval: 3s, timeout: 3s, retries: 30}
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
